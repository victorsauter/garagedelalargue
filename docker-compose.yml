# Optional local Postgres if you want production-parity instead of SQLite.
# After switching prisma/schema.prisma provider to postgresql:
#   DATABASE_URL="postgresql://garage:garage@localhost:5432/garagedelalargue"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
      POSTGRES_DB: garagedelalargue
    ports:
      - "5432:5432"
    volumes:
      - garage_pg:/var/lib/postgresql/data

volumes:
  garage_pg:
